name: Windows Cloud PC (Guacamole)

on:
  workflow_dispatch:
    inputs:
      apps:
        description: "Optional Chocolatey packages to install (space- or comma-separated)"
        required: false
        default: "vlc 7zip notepadplusplus"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 65

    steps:
      - name: Validate the Windows RDP password secret
        shell: pwsh
        env:
          WINDOWS_RDP_PASSWORD: ${{ secrets.WINDOWS_RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_RDP_PASSWORD)) {
            throw "Add WINDOWS_RDP_PASSWORD under Settings > Secrets and variables > Actions."
          }
          if ($env:WINDOWS_RDP_PASSWORD.Length -lt 24) {
            throw "WINDOWS_RDP_PASSWORD must be at least 24 characters."
          }
          if ($env:WINDOWS_RDP_PASSWORD.Contains([char]13) -or $env:WINDOWS_RDP_PASSWORD.Contains([char]10)) {
            throw "WINDOWS_RDP_PASSWORD cannot contain line breaks."
          }
          Write-Host "RDP password secret is present."

      - name: Enable Windows RDP with a dedicated non-admin account
        shell: pwsh
        env:
          WINDOWS_RDP_PASSWORD: ${{ secrets.WINDOWS_RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $rdpUser = "guacuser"
          $securePassword = ConvertTo-SecureString $env:WINDOWS_RDP_PASSWORD -AsPlainText -Force
          $existingUser = Get-LocalUser -Name $rdpUser -ErrorAction SilentlyContinue

          if ($existingUser) {
            Set-LocalUser -Name $rdpUser -Password $securePassword
            Enable-LocalUser -Name $rdpUser
          } else {
            New-LocalUser -Name $rdpUser -Password $securePassword -Description "RDP account for Apache Guacamole" -PasswordNeverExpires | Out-Null
          }

          $rdpGroup = Get-LocalGroup -SID "S-1-5-32-555"
          Add-LocalGroupMember -Group $rdpGroup.Name -Member $rdpUser -ErrorAction SilentlyContinue

          $terminalServerKey = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server"
          $rdpTcpKey = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"

          Set-ItemProperty -Path $terminalServerKey -Name fDenyTSConnections -Value 0
          Set-ItemProperty -Path $rdpTcpKey -Name UserAuthentication -Value 1
          Set-ItemProperty -Path $rdpTcpKey -Name SecurityLayer -Value 2

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          $rdpRules = Get-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction Stop
          $rdpRules | Enable-NetFirewallRule
          $rdpRules | Get-NetFirewallAddressFilter | Set-NetFirewallAddressFilter -RemoteAddress "127.0.0.1","::1"

          $rdpReady = $false
          for ($i = 1; $i -le 20; $i++) {
            if (Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue) {
              $rdpReady = $true
              break
            }
            Start-Sleep -Seconds 2
          }

          if (-not $rdpReady) {
            throw "Windows RDP did not start listening on TCP port 3389."
          }

          Write-Host "RDP is listening on port 3389. Account: $rdpUser. NLA is required."

      - name: Install optional apps
        shell: pwsh
        env:
          APPS: ${{ inputs.apps }}
        run: |
          $ErrorActionPreference = "Continue"
          if ([string]::IsNullOrWhiteSpace($env:APPS)) {
            Write-Host "No optional apps requested."
            exit 0
          }

          $packages = $env:APPS -split '[\\s,]+' | Where-Object { $_ }
          $failed = @()

          foreach ($package in $packages) {
            Write-Host "Installing $package..."
            choco install $package -y --no-progress
            if ($LASTEXITCODE -ne 0) {
              $failed += $package
            }
          }

          if ($failed.Count -gt 0) {
            Write-Warning "These optional packages failed: $($failed -join ', ')"
          }

      - name: Verify Pinggy host key and open the free TCP tunnel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ssh = Get-Command ssh.exe -ErrorAction SilentlyContinue
          $keyscan = Get-Command ssh-keyscan.exe -ErrorAction SilentlyContinue
          $keygen = Get-Command ssh-keygen.exe -ErrorAction SilentlyContinue
          if (-not $ssh -or -not $keyscan -or -not $keygen) {
            throw "Windows OpenSSH Client (ssh.exe, ssh-keyscan.exe, ssh-keygen.exe) is required on the runner."
          }

          $knownHosts = Join-Path $env:RUNNER_TEMP "pinggy_known_hosts"
          $scannedKeys = & $keyscan.Source -p 443 free.pinggy.io 2>$null
          $rsaKeys = @($scannedKeys | Where-Object { $_ -match '\\s+ssh-rsa\\s+' })
          if ($rsaKeys.Count -eq 0) {
            throw "Could not retrieve Pinggy's RSA SSH host key."
          }

          [System.IO.File]::WriteAllLines($knownHosts, $rsaKeys, [System.Text.Encoding]::ASCII)
          $fingerprints = & $keygen.Source -lf $knownHosts -E sha256 2>$null
          $expectedFingerprint = "SHA256:nFd5rfJMGuZXvfeRzJ/BtT3TfksAxTWMajcrHRcI7AM"
          if (-not (($fingerprints -join [Environment]::NewLine) -match [regex]::Escape($expectedFingerprint))) {
            throw "Pinggy host key fingerprint did not match the published fingerprint. Refusing the connection."
          }
          Write-Host "Pinggy SSH host key verified."

          $askPassSource = @'
          using System;
          public static class PinggyEmptyAskPass {
              public static void Main(string[] args) {
                  Console.WriteLine("");
              }
          }
          '@
          $askPassExe = Join-Path $env:RUNNER_TEMP "pinggy-empty-askpass.exe"
          Add-Type -TypeDefinition $askPassSource -Language CSharp -OutputAssembly $askPassExe -OutputType ConsoleApplication

          $env:SSH_ASKPASS = $askPassExe
          $env:SSH_ASKPASS_REQUIRE = "force"
          $env:DISPLAY = "localhost:0"

          @"
          ## Windows Cloud PC — Guacamole connection

          - Protocol: RDP
          - Username: guacuser
          - Password: GitHub Actions secret WINDOWS_RDP_PASSWORD
          - Security: NLA
          - RDP target on the runner: 127.0.0.1:3389

          Copy the temporary tcp:// hostname and port from this step's SSH output. In Guacamole, use that hostname and port, username guacuser, your secret password, and security mode NLA.

          The free tunnel expires after about 60 minutes. Run this workflow again for a new endpoint. The hostname and port will change.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          Write-Host "Starting Pinggy TCP tunnel to local RDP port 3389."
          Write-Host "The temporary tcp:// hostname and port will appear in this step's output."
          Write-Host "This repository is public, so workflow logs may be public. Anyone who sees the endpoint can attempt an RDP login; NLA and a strong password are required."

          $tunnelStarted = Get-Date
          $sshLog = Join-Path $env:RUNNER_TEMP "pinggy-ssh.log"
          $sshArgs = @(
            "-p", "443",
            "-o", "UserKnownHostsFile=$knownHosts",
            "-o", "StrictHostKeyChecking=yes",
            "-o", "ExitOnForwardFailure=yes",
            "-o", "ServerAliveInterval=30",
            "-o", "ServerAliveCountMax=3",
            "-o", "PreferredAuthentications=password",
            "-R0:127.0.0.1:3389",
            "tcp@free.pinggy.io"
          )

          & $ssh.Source @sshArgs 2>&1 | Tee-Object -FilePath $sshLog
          $sshExitCode = $LASTEXITCODE
          $elapsed = (Get-Date) - $tunnelStarted
          $tunnelOutput = if (Test-Path $sshLog) { Get-Content $sshLog -Raw } else { "" }

          if ($tunnelOutput -notmatch 'tcp://([A-Za-z0-9.-]+):(\\d+)') {
            throw "Pinggy did not return a TCP hostname and port. SSH exit code: $sshExitCode. Review the SSH output above."
          }

          if ($elapsed.TotalMinutes -lt 45) {
            throw "The Pinggy tunnel ended unexpectedly after $([math]::Round($elapsed.TotalMinutes,1)) minutes. SSH exit code: $sshExitCode."
          }

          Write-Host "Pinggy's free tunnel ended after about an hour. Run this workflow again to create a fresh endpoint."
