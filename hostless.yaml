build:
  system: docker

dockerfile_path: ./Dockerfile

# Guacamole, guacd, and PostgreSQL share one container.
# Runtime state is temporary under /tmp; keep one replica and expect resets on restart.
scaling:
  trigger: http_requests
  min_cpu: 0.1
  max_cpu: 0.5
  min_memory: 512
  max_memory: 1024
  min_replicas: 1
  max_replicas: 1

health_check:
  type: tcp
  interval_in_seconds: 10
