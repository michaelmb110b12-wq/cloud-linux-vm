build:
  system: docker

dockerfile_path: ./Dockerfile

# Guacamole, guacd, and PostgreSQL share one container and one persistent volume.
# Keep one replica so the embedded PostgreSQL database has a single writer.
scaling:
  trigger: http_requests
  min_cpu: 0.1
  max_cpu: 0.5
  min_memory: 512
  max_memory: 1024
  min_replicas: 1
  max_replicas: 1

health_check:
  type: http
  http_path: /
  interval_in_seconds: 10
